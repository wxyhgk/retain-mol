<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mol-viewer 思维导图</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f5f7fb;
        color: #111827;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 18px;
        border-bottom: 1px solid #dbe1ea;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(10px);
      }

      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
      }

      .meta {
        color: #64748b;
        font-size: 12px;
      }

      main {
        padding: 18px;
      }

      #canvas {
        min-height: calc(100vh - 92px);
        overflow: auto;
        border: 1px solid #dbe1ea;
        border-radius: 10px;
        background: #fff;
      }

      #canvas svg {
        display: block;
        min-width: 100%;
        height: auto;
      }

      .error {
        margin: 18px;
        max-width: 760px;
        border: 1px solid #f0c9c9;
        border-radius: 10px;
        background: #fff7f7;
        padding: 14px 16px;
        color: #7f1d1d;
        line-height: 1.6;
      }

      code {
        border-radius: 6px;
        background: #eef2f7;
        padding: 2px 5px;
        color: #334155;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>mol-viewer 思维导图</h1>
      <div class="meta">来源：<code>src-structure.mmd</code></div>
    </header>
    <main>
      <div id="canvas">正在加载 src-structure.mmd…</div>
    </main>

    <script type="module">
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs'

      const canvas = document.getElementById('canvas')

      mermaid.initialize({
        startOnLoad: false,
        theme: 'base',
        securityLevel: 'loose',
        mindmap: {
          useMaxWidth: false,
        },
        themeVariables: {
          fontFamily: 'ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
          primaryColor: '#eef6ff',
          primaryBorderColor: '#2563eb',
          primaryTextColor: '#111827',
          lineColor: '#64748b',
        },
      })

      async function renderMindmap() {
        try {
          const response = await fetch('./src-structure.mmd', { cache: 'no-store' })
          if (!response.ok) throw new Error(`读取失败：${response.status}`)
          const source = await response.text()
          const { svg } = await mermaid.render('molViewerMindmap', source)
          canvas.innerHTML = svg
        } catch (error) {
          canvas.innerHTML = `
            <div class="error">
              <strong>无法读取或渲染 <code>src-structure.mmd</code>。</strong><br />
              如果你是直接双击用 <code>file://</code> 打开的，浏览器可能拦截了本地文件读取。
              在仓库根目录运行一个静态服务再打开这个页面即可，例如：
              <br />
              <code>python3 -m http.server 8080</code>
              <br />
              然后访问：
              <br />
              <code>http://localhost:8080/docs/mol-viewer/mmd/index.html</code>
            </div>
          `
          console.error(error)
        }
      }

      renderMindmap()
    </script>
  </body>
</html>
